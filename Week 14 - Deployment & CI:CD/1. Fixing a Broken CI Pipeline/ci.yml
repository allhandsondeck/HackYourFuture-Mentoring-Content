# Exercise: Fixing a Broken CI Pipeline
#
# This GitHub Actions workflow is supposed to run tests and build the project
# automatically every time code is pushed to the main branch.
#
# There are 4 bugs hidden in this file. Find and fix them all.
# Each bug is marked with a comment: # ❌
#
# Hints:
# - Check which branch the workflow triggers on
# - Check whether dependencies are installed before tests run
# - Check the Node.js version — "latest" is unpredictable in CI
# - Read every `run:` command carefully

name: CI

on:
  push:
    branches:
      - master # ❌ Bug 1

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest # ❌ Bug 2

      # ❌ Bug 3 — something is missing here before the next step

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run buld # ❌ Bug 4
